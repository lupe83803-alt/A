name: Build Quest Mixed Reality APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip QuestMixedReality-project-v3.zip
          cd QuestMixedReality
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: QuestMixedReality
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: QuestMixedReality-debug-apk
          path: QuestMixedReality/app/build/outputs/apk/debug/app-debug.apk
